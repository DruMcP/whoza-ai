[build]
  command = "npm run build && node scripts/generate-build-info.js && node scripts/build-indexnow-manifest.js"
  publish = ".next"
  environment = { NODE_VERSION = "22", NODE_OPTIONS = "--max-old-space-size=4096", NEXT_TELEMETRY_DISABLED = "1" }

[functions."deploy-succeeded"]
  included_files = ["netlify/functions/indexnow-manifest.json"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# === SEO MIGRATION: Old URLs → New Build (2026-05-14) ===
# === WWW → APEX: Canonical hostname redirect ===
[[redirects]]
  from = "https://www.whoza.ai/*"
  to = "https://whoza.ai/:splat"
  status = 301
  force = true

# === whoza.co.uk → whoza.ai: Eliminate duplicate site ===
[[redirects]]
  from = "https://whoza.co.uk/*"
  to = "https://whoza.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.whoza.co.uk/*"
  to = "https://whoza.ai/:splat"
  status = 301
  force = true

# === /video — retired route, video content lives at homepage #video-explainer ===
# /video/ must resolve in ONE hop to a 200 (never redirect-into-404).
[[redirects]]
  from = "/video"
  to = "/#video-explainer"
  status = 301
  force = true

