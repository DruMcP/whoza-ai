name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create env file
        run: |
          cat > .env.local << 'EOF'
          # === SUPABASE ===
          NEXT_PUBLIC_SUPABASE_URL=https://ligjstpxqtkurvteyyhw.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # === SITE ===
          NEXT_PUBLIC_SITE_URL=https://whoza.ai
          # === STRIPE (placeholder for build — real keys set in Netlify runtime) ===
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_51ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnop
          STRIPE_SECRET_KEY=sk_test_51ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnop
          # === EMAIL (placeholder for build) ===
          RESEND_API_KEY=re_test_placeholder
          # === REX / AI (placeholder for build) ===
          GOOGLE_PLACES_API_KEY=AIza_test_placeholder
          PERPLEXITY_API_KEY=pplx_test_placeholder
          # === TRILLET ===
          TRILLET_BASE_URL=https://api.trillet.ai/v1
          TRILLET_WORKSPACE_ID=whoza-workspace
          TRILLET_AGENT_ID=katie-agent
          # === WHATSAPP ===
          WHATSAPP_PROVIDER=trillet
          EOF

      - name: Build site
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build

      - name: Verify build output
        run: |
          echo "Build output directory contents:"
          ls -la .next/ | head -20
          echo "Build output size:"
          du -sh .next/
          echo ""
          echo "✅ Build verified. Netlify auto-deploys from git push to main."
          echo "   Do NOT use netlify CLI deploy — it breaks the site."
